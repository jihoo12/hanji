<figure class="quote">
  <blockquote>{{slot}}</blockquote>
  {{#if by}}<figcaption>— {{ by }}</figcaption>{{/if}}
</figure>

<style>
.quote { margin: 2rem 0; padding: 1.4rem 1.6rem; border-radius: var(--radius); background: var(--paper-sunk); }
.quote blockquote { margin: 0; padding: 0; border: 0; font-size: 1.15rem; color: var(--ink); }
.quote blockquote > :first-child { margin-top: 0; }
.quote blockquote > :last-child { margin-bottom: 0; }
.quote figcaption { margin-top: .7rem; color: var(--ink-2); font-size: .9rem; text-align: right; }
</style>

<section class="hj-hero">
  {{#if eyebrow}}<p class="hj-hero-eyebrow">{{ eyebrow }}</p>{{/if}}
  <h1>{{ title | default(page.title) }}</h1>
  {{#if tagline}}<p class="hj-hero-tagline">{{ tagline }}</p>{{/if}}
  <div class="hj-hero-body">{{slot}}</div>
</section>
<style>
.hj-hero{padding:clamp(2.5rem,8vw,5.5rem) 0 clamp(1.5rem,4vw,3rem);text-align:center}
.hj-hero .hj-hero-eyebrow{display:inline-block;margin:0 0 1.2rem;padding:.25rem .8rem;border:1px solid var(--line);border-radius:99px;font-size:.82rem;color:var(--ink-2);background:var(--paper-raised)}
.hj-hero h1{font-size:clamp(2.3rem,7vw,4.2rem);line-height:1.12;margin:0 auto;max-width:17ch;letter-spacing:-.02em;text-wrap:balance}
.hj-hero .hj-hero-tagline{font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--ink-2);max-width:40rem;margin:1.2rem auto 0;text-wrap:pretty}
.hj-hero-body{margin-top:1.8rem}
.hj-hero-body p{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.hj-hero-body p>a{padding:.65rem 1.3rem;border-radius:99px;border:1px solid var(--line);text-decoration:none;font-weight:600;color:var(--ink);background:var(--paper-raised)}
.hj-hero-body p>a:first-child{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hj-hero-body p>a:hover{border-color:var(--accent)}
</style>
